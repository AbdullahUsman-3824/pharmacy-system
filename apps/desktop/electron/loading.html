<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline'"
    />
    <title>Importing…</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      /* Mirror the essential tokens from the app theme */
      :root {
        --font-sans: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont,
          system-ui, sans-serif;

        /* Brand */
        --color-primary: #1f54c7;
        --color-primary-hover: #345ed1;
        --color-primary-soft: #eff6ff;
        --color-primary-border: #bfdbfe;

        /* Surfaces */
        --color-background: #f6f8fb;
        --color-card: #ffffff;

        /* Text */
        --color-text: #111827;
        --color-text-secondary: #374151;
        --color-text-muted: #6b7280;

        /* Borders */
        --color-border: #d8dae0;
        --color-border-light: #f1f5f9;

        /* Shadow */
        --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.06);
        --shadow-lg: 0 10px 24px rgba(15, 23, 42, 0.08);

        /* Radius */
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-full: 9999px;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: var(--font-sans);
        background: var(--color-background);
        color: var(--color-text);
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-app-region: no-drag;
        overflow: hidden;
        position: relative;
      }

      /* Soft ambient glow, subtle nod to the primary brand color */
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at 50% 42%,
          rgba(31, 84, 199, 0.06),
          transparent 65%
        );
        pointer-events: none;
      }

      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        padding: 40px 44px 34px;
        background: var(--color-card);
        border: 1px solid var(--color-border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        width: min(340px, calc(100vw - 48px));
        animation: cardIn 0.4s ease-out both;
      }

      @keyframes cardIn {
        from { opacity: 0; transform: translateY(8px) scale(0.98); }
        to   { opacity: 1; transform: translateY(0)   scale(1); }
      }

      /* ---- Icon + Spinner ---- */

      .mark {
        position: relative;
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
      }

      /* Faint ring behind, always visible as a track */
      .mark::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: var(--color-primary-soft);
      }

      /* The rotating arc */
      .spinner {
        position: relative;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: var(--color-primary);
        border-right-color: var(--color-primary);
        animation: spin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* The little dot / glyph inside the mark */
      .glyph {
        position: absolute;
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: var(--color-primary);
        opacity: 0.9;
        display: grid;
        place-items: center;
        color: white;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.02em;
        animation: breathe 2.2s ease-in-out infinite;
      }

      @keyframes breathe {
        0%, 100% { opacity: 0.85; transform: scale(0.96); }
        50%      { opacity: 1;    transform: scale(1.02); }
      }

      /* ---- Text ---- */

      .copy {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        text-align: center;
      }

      .title {
        font-size: 15px;
        font-weight: 600;
        color: var(--color-text);
        letter-spacing: -0.005em;
      }

      .subtitle {
        font-size: 12.5px;
        color: var(--color-text-muted);
        letter-spacing: 0.01em;
        line-height: 1.4;
      }

      /* ---- Progress bar ---- */

      .progress {
        position: relative;
        width: 100%;
        height: 4px;
        background: var(--color-border-light);
        border-radius: var(--radius-full);
        overflow: hidden;
      }

      .progress::after {
        content: "";
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        border-radius: var(--radius-full);
        background: linear-gradient(
          90deg,
          transparent,
          var(--color-primary) 45%,
          var(--color-primary-hover) 55%,
          transparent
        );
        animation: slide 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @keyframes slide {
        0%   { left: -40%; }
        100% { left: 100%; }
      }

      /* ---- Foot ---- */

      .foot {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--color-text-muted);
        letter-spacing: 0.02em;
      }

      .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--color-primary);
        animation: blink 1.4s ease-in-out infinite;
      }
      .dot:nth-child(2) { animation-delay: 0.2s; }
      .dot:nth-child(3) { animation-delay: 0.4s; }

      @keyframes blink {
        0%, 60%, 100% { opacity: 0.25; }
        30%           { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">
        <div class="glyph">DB</div>
        <div class="spinner"></div>
      </div>

      <div class="copy">
        <p class="title">Importing database</p>
        <p class="subtitle">
          Please wait, we're preparing your data.
        </p>
      </div>

      <div class="progress"></div>

      <div class="foot">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span>Working…</span>
      </div>
    </div>
  </body>
</html>
